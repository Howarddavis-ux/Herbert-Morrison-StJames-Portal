<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrator Dashboard</title>
</head>
<style>
    body {
       font-family: Arial, sans-serif;
    background-color: #ffffff;
    color: #800020;
    margin: 20px;
}

h1, h2, h3 {
    color: #800020;
}

button {
    background-color: #800020;
    color: white;
    border: none;
    padding: 10px 15px;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background-color: #5c0017;
}

input, select {
    padding: 8px;
    border: 1px solid #800020;
    border-radius: 5px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th {
    background-color: #800020;
    color: white;
    padding: 10px;
}

td {
    padding: 10px;
    border: 1px solid #800020;
}

section {
    background-color: white;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid #800020;
    border-radius: 8px;
}</style>
</style>

<body>
    <h1>School Portal</h1>
    <h2>Welcome to the Administrator Dashboard</h2>

    <main>
        <section>
            <h3>Register New Students</h3>
            <form id="registerStudentForm">
                <label for="studentfName">First Name:</label>
                <input type="text" id="studentfName" name="studentfName" required>

                <br><br>

                <label for="studentlName">Last Name:</label>
                <input type="text" id="studentlName" name="studentlName" required>

                <br><br>

                <label for="studentAge">Age:</label>
                <input type="value" id="studentAge" name="studentAge" min="1" required>

                <br><br>

                <label for="studentID">Student ID</label>
                <input type="value" id="studentID" name="studentID" required>

                <br><br>

                <label for="studentGrade">Grade:</label>

                <select id="studentGrade" name="studentGrade" required>

                    <option value="">Select Grade</option>
                    <option value="grade 7">7th Grade</option>
                    <option value="grade 8">8th Grade</option>
                    <option value="grade 9">9th Grade</option>
                    <option value="grade 10">10th Grade</option>
                    <option value="grade 11">11th Grade</option>
                    <option value="grade 12">12th Grade</option>

                </select>

                <br><br>

                <label for="semester">Semester:</label>

                <select id="semester" name="semester" required>

                    <option value="">Select Semester</option>
                    <option value="semester 1">Semester 1</option>
                    <option value="semester 2">Semester 2</option>

                </select>

                <br><br>

                <button type="submit">Register Student</button>

            </form>
            
            <p id="successMessage"></p>

        </section>

        <section>
            <h3>Registered Students</h3>
            <table border="1">
                <thead>
                    <tr>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Student ID</th>
                        <th>Age</th>
                        <th>Grade</th>
                        <th>Semester</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">

                </tbody>
            </table>
        </section>
    </main>


    
    <script>
        const registeredStudents = JSON.parse(localStorage.getItem("registeredStudents")) || [];
        const registerForm = document.getElementById("registerStudentForm");
        const tableBody = document.getElementById("studentTableBody");
        const successMessage = document.getElementById("successMessage");

        function displayStudents() {
            tableBody.innerHTML = "";

            registeredStudents.forEach(function(student) {
                const row = document.createElement("tr");

                const studentDetails = [
                    student.studentfName,
                    student.studentlName,
                    student.studentID,
                    student.studentAge,
                    student.studentGrade,
                    student.semester
                ];

                studentDetails.forEach(function(detail) {
                    const cell = document.createElement("td");
                    cell.textContent = detail;
                    row.appendChild(cell);
                });

                //part 1 of my crud section 
                const actionsCell = document.createElement("td");
                const editButton = document.createElement("button");
                editButton.textContent = "Edit";
                editButton.onclick = function(editEvent) {
                    const studentID = student.studentID;
                    const studentIndex = registeredStudents.findIndex(function(s) {
                        return s.studentID === studentID;
                    });

                    if (studentIndex !== -1) {
                        const updatedfName = prompt("Enter new first name:", registeredStudents[studentIndex].studentfName);
                        const updatedlName = prompt("Enter new last name:", registeredStudents[studentIndex].studentlName);
                        const updatedAge = prompt("Enter new age:", registeredStudents[studentIndex].studentAge);
                        const updatedGrade = prompt("Enter new grade:", registeredStudents[studentIndex].studentGrade);
                        const updatedSemester = prompt("Enter new semester:", registeredStudents[studentIndex].semester);

                        if (updatedfName && updatedlName && updatedAge && updatedGrade && updatedSemester) {
                            registeredStudents[studentIndex] = {
                                studentfName: updatedfName,
                                studentlName: updatedlName,
                                studentAge: updatedAge,
                                studentID: studentID,
                                studentGrade: updatedGrade,
                                semester: updatedSemester
                            };
                            localStorage.setItem(
                                "registeredStudents",
                                JSON.stringify(registeredStudents)
                            );
                            displayStudents();
                        }
                    }
                    
                };

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.onclick = function() {
                    const index = registeredStudents.findIndex(function(s) {
                        return s.studentID === student.studentID;
                    });
                    if (index !== -1) {
                        registeredStudents.splice(index, 1);
                        localStorage.setItem(
                            "registeredStudents",
                            JSON.stringify(registeredStudents)
                        );
                        displayStudents();
                    }
                };
                actionsCell.appendChild(editButton);
                actionsCell.appendChild(deleteButton);
                row.appendChild(actionsCell);

                tableBody.appendChild(row);

            });
        }
        registerForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const studentfName = document.getElementById("studentfName").value.trim();
            const studentlName = document.getElementById("studentlName").value.trim();
            const studentAge = document.getElementById("studentAge").value;
            const studentID = document.getElementById("studentID").value.trim();
            const studentGrade = document.getElementById("studentGrade").value;
            const semester = document.getElementById("semester").value;

            const studentExists = registeredStudents.some(function(student) {
                return student.studentID === studentID;

            });

            if (studentExists) {
                alert("This Student ID is already registered!");
                return;
            }

            const newStudent = {
                studentfName: studentfName,
                studentlName: studentlName,
                studentAge: studentAge,
                studentID: studentID,
                studentGrade: studentGrade,
                semester: semester
            };
            registeredStudents.push(newStudent);
            localStorage.setItem(
                "registeredStudents",
                JSON.stringify(registeredStudents)
            );
            successMessage.textContent =
                "Student registered successfully!";

            displayStudents();

            registerForm.reset();

        });
        displayStudents();
    </script>
</body>
</html>
