<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Herbert Morrison Technical High School</title>
    <link rel="stylesheet" href="../style/main.css">
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <div class="school-name">
                Herbert Morrison Technical High School
                <span>St. James, Jamaica</span>
            </div>
            <nav class="site-nav">
                <a href="../index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact Us</a>
                <a href="login.html">Login</a>
            </nav>
        </div>
    </header>

    <div class="page-banner">
        <h1>Staff Login</h1>
        <p>Administrators and teachers sign in below.</p>
    </div>

    <main>

        <div class="login-box">
            <h2>Sign In</h2>

            <form id="form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Log In</button>
            </form>

            <p id="error" class="error-msg" role="alert"></p>
            <p id="out" class="out-msg"></p>

            <p style="text-align:center; margin-top: 20px; font-size: 14px;">
                <a href="../index.html" style="color: var(--red);">Return to Home</a>
            </p>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Herbert Morrison Technical High School  St. James, Jamaica</p>
    </footer>

    <script src="../js/Herbert-Morrison-StJames-DB.js"></script>
    <script src="../js/Herbert-Morrison-StJames-Auth.js"></script>
    <script>
        document.getElementById('form').addEventListener('submit', function() {
            sessionStorage.removeItem('CurrentUser');
            setTimeout(function() {
                try {
                    var stored = sessionStorage.getItem('CurrentUser');
                    if (!stored) return;
                    var user = JSON.parse(stored);
                    if (user && user.role === 'admin') {
                        window.location.href = 'StudentRegistration.html';
                    } else if (user && user.role === 'teacher') {
                        window.location.href = 'instructor.html';
                    } else if (user && user.role === 'reviewer') {
                        window.location.href = 'reviewer.html';
                    }
                } catch (err) {}
            }, 200);
        });
    </script>

</body>
</html>
